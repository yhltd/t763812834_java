<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>配置表</title>
    <link rel="shortcut icon" href="#"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="../js/Jquery.js"></script>
    <script type="text/javascript" src="../js/jquerysession.js"></script>

    <link rel="stylesheet" href="../bootstrap-4.5.0-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../bootstrap-4.5.0-dist/icons/bootstrap-icons.css">
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap.min.js"></script>

    <!--bootstrap-table-->
    <link rel="stylesheet" href="../bootstrap-4.5.0-dist/css/bootstrap-table.css">
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap-table.js"></script>
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap-table-zh-CN.min.js"></script>
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/colResizable-1.6.js"></script>
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap-table-resizable.js"></script>
    <script type="text/javascript" src="../js/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="../css/sweetalert.css">
    <script type="text/javascript" src="../js/sweetalert-dev.js"></script>

    <link rel="stylesheet" href="../css/main.css">
    <script type="text/javascript" src="../js/main.js"></script>
    <script type="text/javascript" src="../js/Pzb.js"></script>

    <style>
        .editable-cell {
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }

        .editable-cell:hover {
            background-color: #f8f9fa !important;
        }

        .editable-cell.editing {
            background-color: #fff3cd !important;
            padding: 0 !important;
        }

        .cell-edit-input {
            border: 2px solid #007bff !important;
            outline: none !important;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5) !important;
        }

        .table-div {
            margin-top: 10px;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            overflow: auto;
        }

        .custom-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 200px;
        }

        /* 确保表格单元格有合适的padding */
        .table td, .table th {
            padding: 8px;
            vertical-align: middle;
        }
         .page-indicator {
             cursor: pointer;
             transition: all 0.3s ease;
             padding: 8px 12px;
             border-radius: 6px;
             display: inline-block;
         }

        .page-indicator:hover {
            background-color: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            transform: translateY(-1px);
        }

        .modal-body h6 {
            color: #495057;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .modal-body ul {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .modal-body ul li {
            margin-bottom: 0.3rem;
        }

        /* ==================== 移动端body padding调整（安全方案） ==================== */

        /* 手机设备 (768px以下) */
        @media screen and (max-width: 768px) {
            .body-yangshi {
                padding-top: 70px !important;
                padding-left: 5px;
                padding-right: 5px;
            }
        }

        /* 小屏幕手机 (576px以下) */
        @media screen and (max-width: 576px) {
            .body-yangshi {
                padding-top: 70px !important;
                padding-left: 3px;
                padding-right: 3px;
            }
        }

        /* 超小屏幕手机 (360px以下) */
        @media screen and (max-width: 360px) {
            .body-yangshi {
                padding-top: 70px !important;
                padding-left: 2px;
                padding-right: 2px;
            }
        }

        /* 简化版移动端下拉 */
        @media screen and (max-width: 800px) {
            .top-toolbar {
                display: none;
                padding: 15px !important;
                max-height: 300px;
                overflow-y: auto;
            }

            .top-zujian.expanded .top-toolbar {
                display: block !important;
            }

            .mobile-toggle {
                display: block !important;
                background: #4361ee;
                color: white;
                padding: 10px;
                text-align: center;
                cursor: pointer;
                border-bottom: 1px solid #3a0ca3;
            }

            .mobile-toggle i {
                margin-right: 8px;
            }
        }
        /* 电脑端：正常显示 */
        .mobile-toggle {
            display: none; /* 默认隐藏 */
        }
    </style>

</head>

<body  class=" body-yangshi" style=" padding: 130px 10px 0 10px;">
<div class="top-zujian">
    <!-- 简化下拉按钮 -->
    <div class="mobile-toggle" onclick="$('.top-toolbar').slideToggle(); $(this).find('i').toggleClass('bi-chevron-down bi-chevron-up');">
        <i class="bi bi-chevron-down"></i> 展开搜索栏
    </div>
    <div class="time-bar">
        <div class="time-display">
            <i class="bi bi-calendar tubiao "></i>
            <span class="time-text" id="current-date">2025年8月15日 星期五</span>
            <i class="bi bi-clock tubiao "></i>
            <span class="time-text" id="current-time">14:31:33</span>
        </div>
        <span style="margin-left: 50px;font-size: 20px">  您 好 <b><span
                id="dlm" style="color:white "></span></b> , 欢 迎 您 登 录 !</span>
        <div class="session-time">
            <i class="bi bi-box-arrow-right tubiao" ></i>
            <a href="../index.html"  data-src="退出" target="_top" class="dingbu">退出登录</a>
        </div>
    </div>
    <div class="top-toolbar row">
        <div class="col-md-3 mb-2">
            <input id="gsm" type="text" class="form-control" placeholder="负责人姓名" autocomplete="off">
        </div>
        <div class="col-md-2 mb-2">
            <button id="select-btn" class="btn btn-color" style="color: white">
                <i class="bi bi-search icon"></i>
                查询
            </button>
        </div>

        <div class="btn-group mb-2" role="group">
            <button id="refresh-btn" class="btn btn-color" style="border-radius:5px;">
                <i class="bi bi-arrow-clockwise icon"></i>
                刷新
            </button>
            <span style="border-right: 20px solid white"></span>

            <button id="add-btn" class="btn btn-color" style="border-radius:5px;">
                <i class="bi bi-plus-square icon"></i>
                新增一行
            </button>
            <span style="border-right: 20px solid white"></span>
            <!--        <button id="update-btn" class="btn btn-primary" style="border-radius:5px;">-->
            <!--            <i class="bi bi-pencil-square icon"></i>-->
            <!--            修改-->
            <!--        </button>-->
            <!--        <span style="border-right: 20px solid white"></span>-->
            <button id="delete-btn" class="btn btn-color-delete" style="border-radius:5px;">
                <i class="bi bi-trash icon"></i>
                删除
            </button>
            <span style="border-right: 20px solid white"></span>
            <button id="ghf-btn" class="btn btn-color" style="border-radius:5px;">
                <i class="bi bi-plus-square icon"></i>
                修改供货方配置
            </button>
            <span style="border-right: 20px solid white"></span>
            <a class="btn btn-dangqian"  id="pageIndicator" style="color: white;padding-top: 8px;border-radius:5px;">当前页：配置表</a>
        </div>
    </div>
</div>



<div id="table-toolbar">

</div>

<div class="table-div border-top">
    <table id="qhdTable" class="gradient-table"></table>
</div>

<!-- 配置表使用说明弹窗 -->
<div class="modal fade" id="instructionsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-info-circle me-2"></i>
                    配置表使用说明
                </h5>
            </div>
            <div class="modal-body">
                <h6><i class="bi bi-1-circle me-2"></i>基本操作</h6>
                <ul>
                    <li>可根据负责人姓名进行条件查询。</li>
                    <li>点击新增一行按钮，会新生成一行。</li>
                    <li>该表格的信息可直接在表格中输入。</li>
                    <li>选择一行数据，点击删除按钮，会删除此条信息。</li>

                </ul>

            </div>
        </div>
    </div>
</div>


<div id="update-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑</div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="update-form" class="needs-validation">
                    <div class="form-group">
                        <input id="id" name="id" type="hidden"  value="1">
                    </div>

                    <div class="row justify-content-evenly">
                        <div class="col-6">
                            <div class="form-group">
                                <label for="update-ghf">供货方</label>
                                <input id="update-ghf" name="ghf" type="text" class="form-control" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label for="update-khh">开户行</label>
                                <input id="update-khh" name="khh" type="text" class="form-control" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label for="update-zhanghao">账号</label>
                                <input id="update-zhanghao" name="zhanghao" type="text" class="form-control" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label for="update-shuihao">税号</label>
                                <input id="update-shuihao" name="shuihao" type="text" class="form-control" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label for="update-dizhi">地址</label>
                                <input id="update-dizhi" name="dizhi" type="text" class="form-control" autocomplete="off">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="update-shuilv">税率</label>
                            <input id="update-shuilv" name="shuilv" type="text" class="form-control" autocomplete="off">
                        </div>
                    </div>
                </form>
            </div>
            <div class="border-top" style="padding: 15px;">
                <button id="update-submit-btn" type="button" class="btn" style="background-color: limegreen;color: white">
                    <i class="bi bi-arrow-bar-up icon"></i>
                    提交
                </button>
                <button id="update-close-btn" type="button" class="btn left-margin" style="background-color: red;color: white">
                    <i class="bi bi-x-circle icon"></i>
                    关闭
                </button>
            </div>
        </div>
    </div>
</div>

<div id="delete-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">提示</div>
            </div>
            <div id="delete-modal-body" class="modal-body">
                确定删除吗？
            </div>
            <div class="border-top" style="padding: 15px;">
                <button id="delete-submit-btn" type="button" class="btn">
                    <i class="bi bi-arrow-bar-up icon"></i>
                    确定
                </button>
                <button id="delete-close-btn" type="button" class="btn left-margin">
                    <i class="bi bi-x-circle icon"></i>
                    取消
                </button>
            </div>
        </div>
    </div>
</div>

</body>
<script>
    // 初始化时间显示
    function updateTime() {
        const now = new Date();
        document.getElementById('current-date').textContent =
            `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${['日','一','二','三','四','五','六'][now.getDay()]}`;
        document.getElementById('current-time').textContent =
            `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
    }
    // 启动定时器
    updateTime();
    setInterval(updateTime, 1000);

    $(document).ready(function() {
        // 点击页面指示器显示使用说明弹窗
        $('#pageIndicator').on('click', function() {
            $('#instructionsModal').modal('show');
        });

        // 已阅读按钮点击事件
        $('#confirmReadBtn').on('click', function() {
            $('#instructionsModal').modal('hide');
            localStorage.setItem('workReportInstructionsRead', 'true');
            console.log('用户已确认阅读使用说明');
        });
    });

</script>
</html>
