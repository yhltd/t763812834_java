<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>送货单</title>
    <link rel="shortcut icon" href="#"/>

    <script type="text/javascript" src="../js/Jquery.js"></script>
    <script type="text/javascript" src="../js/jquerysession.js"></script>

    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap.min.js"></script>

    <!--bootstrap-table-->

    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap-table.js"></script>
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap-table-zh-CN.min.js"></script>
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/colResizable-1.6.js"></script>
    <script type="text/javascript" src="../bootstrap-4.5.0-dist/js/bootstrap-table-resizable.js"></script>

    <script type="text/javascript" src="../js/sweetalert-dev.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 打印控制按钮区域 - 不打印 */
        .print-controls {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 5px;
            width: 100%;
            /*max-width: 800px;*/
        }

        .print-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
            transition: background 0.3s;
        }

        .print-btn:hover {
            background: #0056b3;
        }

        .row-controls {
            margin-top: 15px;
        }

        .row-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 5px;
            transition: background 0.3s;
        }

        .row-btn:hover {
            background: #218838;
        }

        .row-btn.remove {
            background: #dc3545;
        }

        .row-btn.remove:hover {
            background: #c82333;
        }

        /* 送货单主体 - 需要打印的区域 */
        .delivery-note {
            width: 100%;
            /*max-width: 800px;*/
            background-color: white;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .company-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .document-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .address {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .customer-info {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        .content {
            padding: 15px;
        }

        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .product-table th, .product-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .product-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .readonly-cell {
            color: #495057;
        }

        .editable-cell {
            background-color: #ffffff;
        }

        .total-row {
            font-weight: bold;
            background-color: #f9f9f9;
        }

        .note {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
            line-height: 1.5;
        }

        .signature-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .signature-box {
            width: 48%;
        }

        .signature-title {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .signature-line {
            border-bottom: 1px solid #333;
            height: 30px;
        }

        .signature-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #333;
            padding: 5px 0;
            font-size: 14px;
            text-align: center;
            background: transparent;
            outline: none;
        }

        .signature-input:focus {
            border-bottom-color: #007bff;
        }

        /* 选中行样式 */
        .selected-row {
            background-color: #e3f2fd !important;
        }

        .selection-info {
            margin-top: 10px;
            padding: 8px;
            background: #d4edda;
            border-radius: 4px;
            font-size: 14px;
            color: #155724;
        }

        /* 发货标签区域 */
        .labels-section {
            width: 100%;
            /*max-width: 800px;*/
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .labels-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .labels-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .labels-controls {
            display: flex;
            gap: 10px;
        }

        .label-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .label-btn:hover {
            background: #5a6268;
        }

        .label-btn.print {
            background: #17a2b8;
        }

        .label-btn.print:hover {
            background: #138496;
        }

        .labels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            min-height: 100px;
        }

        .label {
            width: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 12px;
        }

        .label-header {
            text-align: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eaeaea;
            font-weight: bold;
            display: flex;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            padding-bottom: 3px;
            border-bottom: 1px dashed #f0f0f0;
        }

        .label-field {
            font-weight: bold;
            color: #555;
        }

        .label-value {
            color: #333;
        }

        .empty-labels {
            text-align: center;
            color: #6c757d;
            padding: 20px;
            width: 100%;
        }

        /* 屏幕显示样式 */
        @media screen {
            .page-info {
                float: right;
                margin-top: -25px;
                margin-right: 20px;
                font-size: 12px;
                color: #666;
            }
        }

        /* 打印样式 */
        @media print {

            .page-info {
                position: fixed;
                top: 5mm;
                left: 5mm;
                font-size: 10pt !important;
                color: #000 !important;
                z-index: 1000;
                background: white;
                padding: 2px 5px;
                border: 1px solid #ccc;
                border-radius: 3px;
            }
            /* 隐藏不打印的元素 */
            .print-controls, .labels-section {
                display: none !important;
            }

            /* 调整打印样式 */
            body {
                background: white;
                padding: 0;
            }

            .delivery-note {
                box-shadow: none;
                border: 1px solid #000;
                max-width: 100%;
            }

            /* 确保打印时黑色文字 */
            .address, .note {
                color: #000;
            }

            /* 打印时隐藏下拉框和日期选择框的边框及箭头 */
            #contract-select, #fhrq {
                /* 移除所有边框和样式 */
                border: none !important;
                outline: none !important;
                box-shadow: none !important;
                background: transparent !important;

                /* 移除所有浏览器特定的样式 */
                appearance: none !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                -ms-appearance: none !important;

                /* 确保内容正常显示 */
                color: #000 !important;
                font-size: 14px !important;
                padding: 0 !important;
                margin: 0 !important;
                width: auto !important;
                height: auto !important;

                /* 移除内边距和背景 */
                background-color: transparent !important;
                background-image: none !important;
            }

            /* 隐藏所有浏览器的下拉箭头 */
            #contract-select::-ms-expand {
                display: none !important;
            }

            #contract-select::-webkit-arrow {
                display: none !important;
            }

            #contract-select::-webkit-inner-spin-button,
            #contract-select::-webkit-outer-spin-button {
                display: none !important;
            }

            /* 隐藏日期选择器的所有图标和按钮 */
            #fhrq::-webkit-calendar-picker-indicator {
                display: none !important;
                -webkit-appearance: none !important;
            }

            #fhrq::-webkit-inner-spin-button,
            #fhrq::-webkit-outer-spin-button,
            #fhrq::-webkit-clear-button {
                display: none !important;
                -webkit-appearance: none !important;
            }

            #fhrq::-moz-calendar-picker-indicator {
                display: none !important;
            }

            #fhrq::-ms-clear {
                display: none !important;
            }

            #fhrq::-ms-reveal {
                display: none !important;
            }

            /* 打印时签名输入框样式 */
            .signature-input {
                border: none;
                border-bottom: 1px solid #333;
            }

            .signature-input:focus {
                border-bottom-color: #333;
            }
        }
    </style>
</head>
<body>
<!-- 打印控制区域 - 不会打印出来 -->
<div class="print-controls">
    <button class="print-btn" onclick="getshdlist()">刷新</button>
    <button class="print-btn" onclick="window.print()">打印送货单</button>
    <button class="print-btn" onclick="shipAll()" style="background:#28a745;">发货</button>
    <button class="print-btn" onclick="deleteSelected()" style="background:#dc3545;">删除选中行</button>
    <div class="selection-info">
        <span id="selected-count">已选中 0 行</span>
        <span id="total-count" style="margin-left: 15px;">总计 0 行</span>
    </div>
</div>

<!-- 送货单内容 - 会打印出来 -->
<div class="delivery-note">
    <div class="header">
        <div class="company-name">-送货单</div>
        <div class="address" id="company-address">地址：昆山市张浦镇同舟路188号3号厂房</div>
        <!-- 添加页码显示 -->
        <div class="page-info" id="page-info" style="text-align: right; margin-top: 5px; font-size: 12px; color: #666;">
            第 <span id="current-page">1</span> 页 / 共 <span id="total-pages">1</span> 页
        </div>
    </div>


    <div class="customer-info">
        <div>客户：<span id="customer-name">客户</span></div>
        <div>发货日期：<input id="fhrq" type="date" class="form-control" placeholder="发货日期" autocomplete="off"></div>
        <div>合同编号：
            <input type="text" id="contract-input" class="form-control"
                   placeholder="输入合同编号筛选"
                   list="contract-datalist"
                   autocomplete="off"
                   style="width: 250px;"
                   onchange="handleContractChange()">

            <datalist id="contract-datalist">
                <!-- 这里会通过JS动态填充所有合同 -->
            </datalist>
        </div>
    </div>

    <div class="content">
        <table class="product-table" id="product-table">
            <thead>
            <tr>
                <th>序号</th>
                <th>品名</th>
                <th>规格</th>
                <th>数量</th>
                <th>单位</th>
                <th>备注</th>
            </tr>
            </thead>
            <tbody id="table-body">
            <tr>
                <td>1</td>
                <td>直线导轨</td>
                <td>GENEOCA1R890ZDC</td>
                <td>3</td>
                <td>根</td>
                <td></td>
            </tr>
            </tbody>
            <tfoot>
            <tr class="total-row">
                <td colspan="3">Total</td>
                <td id="total-quantity">3</td>
                <td colspan="2"></td>
            </tr>
            </tfoot>
        </table>

        <div class="note">
            说明：以上货品请核对数量，如有质量问题，请在3日内联系本公司，逾期恕不负责。
        </div>

        <div class="signature-area">
            <div class="signature-box">
                <div class="signature-title">送货单位及经手人：  <input type="text" class="signature-input" ></div>

            </div>
            <div class="signature-box">
                <div class="signature-title">收货单位及经手人：<input type="text" class="signature-input"></div>

            </div>
        </div>
    </div>
</div>

<!-- 发货标签区域 -->
<!-- 发货标签区域 -->
<div class="labels-section">
    <div class="labels-header">
        <div class="labels-title">发货标签</div>
        <div class="labels-controls">
            <div class="labels-selection-controls">
                <div class="checkbox-group">
                    <label class="label-checkbox">
                        <input type="checkbox" id="select-all-labels" onchange="toggleSelectAllLabels(this.checked)">
                        <span class="checkmark"></span>
                        全选
                    </label>
                </div>
                <div class="checkbox-group">
                    <label class="label-checkbox">
                        <input type="checkbox" id="edit-mode-toggle" onchange="toggleEditMode(this.checked)">
                        <span class="checkmark"></span>
                        编辑模式
                    </label>
                </div>
                <span id="selected-labels-count">已选择 0 个标签</span>
            </div>
            <div class="label-btn-group">
                <button class="label-btn" onclick="clearLabels()">清空标签</button>
                <button class="label-btn" onclick="shipSelected()">发货选中</button>
                <button class="label-btn print" onclick="printSelectedLabels()">打印选中标签</button>
            </div>
        </div>
    </div>
    <div class="labels-container" id="labels-container">
        <div class="empty-labels">暂无发货标签，请点击"发货"生成标签</div>
    </div>
</div>

<script>
    let rowCount = 1;
    let selectedIds = [];
    let deletedIds = []; // 存储被删除的ID，发货时排除这些ID
    let labelQuantities = {}; // 存储标签数量修改值
    let allLabelsData = []; // 存储所有标签数据
    let labelEditMode = false; // 标签编辑模式
    let selectedLabelIds = new Set(); // 存储选中的标签ID

    // 修改 addRow 函数，空行不设置data-id
    function addRow() {
        rowCount++;
        const tableBody = document.getElementById('table-body');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
        <td class="readonly-cell">${rowCount}</td>
        <td class="readonly-cell"></td>
        <td class="readonly-cell"></td>
        <td class="readonly-cell"></td>
        <td class="readonly-cell"></td>
        <td class="editable-cell">
            <input type="text" style="border:none; width:100%; text-align:center; background:transparent;">
        </td>
    `;
        tableBody.appendChild(newRow);
        updateRowCount();
        updateTotalCount();
    }

    // 行点击选中功能
    function setupRowSelection() {
        const tableBody = document.getElementById('table-body');
        tableBody.addEventListener('click', function(e) {
            const row = e.target.closest('tr');
            if (row && row.parentElement === tableBody) {
                toggleRowSelection(row);
            }
        });
    }

    // 切换行选中状态
    function toggleRowSelection(row) {
        const rowId = row.getAttribute('data-id');

        if (rowId) {
            if (row.classList.contains('selected-row')) {
                // 取消选中
                row.classList.remove('selected-row');
                selectedIds = selectedIds.filter(id => id !== rowId);
            } else {
                // 选中
                row.classList.add('selected-row');
                selectedIds.push(rowId);
            }
            updateSelectedCount();
        }
    }

    // 更新选中行计数
    function updateSelectedCount() {
        const selectedCountElement = document.getElementById('selected-count');
        if (selectedCountElement) {
            selectedCountElement.textContent = `已选中 ${selectedIds.length} 行`;
        }
    }


    function onddhChange() {
        const contractSelect = document.getElementById('contract-select');
        const contractNumber = contractSelect ? contractSelect.value : '';

        if (!contractNumber) {
            console.log('未选择合同');
            return;
        }

        console.log('原select合同号变更:', contractNumber);

        // 同时更新输入框的值
        const input = document.getElementById('contract-input');
        if (input) {
            input.value = contractNumber;
        }

        getshdlist();
    }
    // 更新行数显示
    // 更新行数显示
    // 更新行数显示（只更新序号）
    function updateRowCount() {
        // 更新所有行的序号
        const rows = document.querySelectorAll('#table-body tr');
        rows.forEach((row, index) => {
            row.cells[0].textContent = index + 1;
        });
    }


    // 清空选中状态
    function clearSelection() {
        selectedIds = [];
        const selectedRows = document.querySelectorAll('.selected-row');
        selectedRows.forEach(row => {
            row.classList.remove('selected-row');
        });
        updateTotalCount();
    }

    // 更新总数
    function updateTotal() {
        let total = 0;
        const rows = document.querySelectorAll('#table-body tr');

        rows.forEach(row => {
            const quantityCell = row.cells[3];
            const quantity = parseInt(quantityCell.textContent) || 0;
            total += quantity;
        });

        document.getElementById('total-quantity').textContent = total;
    }



    function getddh() {
        var date = new Date();
        var jsyear = date.getFullYear();
        var jsmonth = ('0'+(date.getMonth()+1)).slice(-2);
        var jsday = ('0'+date.getDate()).slice(-2);
        var js = jsyear+'-'+jsmonth+'-'+jsday;
        document.getElementById("fhrq").value = js;

        $.ajax({
            type: 'post',
            url: '/dyshd/getddh',
            contentType: 'application/json',
            data: JSON.stringify({}),
            dataType: 'json',
            success: function(res) {
                console.log("AJAX请求成功");

                if (res.code == 200) {
                    console.log("查询成功，数据:", res.data);
                    // 填充datalist
                    fillContractDatalist(res.data || []);
                } else {
                    console.error("查询失败:", res.message);
                }
            },
            error: function(xhr, status, error) {
                console.error("AJAX请求失败:", error);
            }
        });
    }

    function fillContractDatalist(contractData) {
        console.log('填充合同datalist，数据量:', contractData.length);

        const datalist = document.getElementById('contract-datalist');
        if (!datalist) {
            console.error('未找到datalist元素');
            return;
        }

        // 清空现有选项
        datalist.innerHTML = '';

        if (contractData && contractData.length > 0) {
            // 去重（按合同号去重）
            const uniqueContracts = Array.from(
                new Map(contractData.map(item => [item.ddh, item])).values()
            );

            console.log('去重后合同数量:', uniqueContracts.length);

            // 填充datalist选项
            uniqueContracts.forEach(contract => {
                if (contract.ddh && contract.ddh.trim() !== '') {
                    const option = document.createElement('option');
                    option.value = contract.ddh;
                    option.textContent = contract.ddh;
                    datalist.appendChild(option);
                }
            });

            console.log('datalist填充完成');
        }
    }

    // 打印选中标签
    function printSelectedLabels() {
        if (selectedLabelIds.size === 0) {
            alert('请先选择要打印的标签！');
            return;
        }

        const labelsContainer = document.getElementById('labels-container');
        const selectedLabelsHTML = Array.from(selectedLabelIds)
            .map(labelId => {
                const labelElement = document.getElementById(labelId);
                return labelElement ? labelElement.outerHTML : '';
            })
            .filter(html => html !== '')
            .join('');

        if (!selectedLabelsHTML) {
            alert('没有可打印的标签！');
            return;
        }

        // 创建打印窗口
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>打印发货标签</title>
            <style>
                body {
                    font-family: "Microsoft YaHei", sans-serif;
                    margin: 0;
                    padding: 20px;
                }
                .labels-print-container {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 15px;
                    justify-content: center;
                }
                .label {
                    width: 200px;
                    padding: 12px;
                    border: 1px solid #ddd;
                    border-radius: 8px;
                    background: white;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                    font-size: 12px;
                    page-break-inside: avoid;
                }
                .label-header {
                    text-align: center;
                    margin-bottom: 8px;
                    padding-bottom: 5px;
                    border-bottom: 1px solid #eaeaea;
                    font-weight: bold;
                }
                .label-row {
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 4px;
                    padding-bottom: 3px;
                    border-bottom: 1px dashed #f0f0f0;
                }
                .label-field {
                    font-weight: bold;
                    color: #555;
                }
                .label-value {
                    color: #333;
                }
                .checkbox-group, .edit-quantity-btn, .label-actions {
                    display: none !important;
                }
                @media print {
                    body {
                        padding: 0;
                    }
                    @page {
                        margin: 10mm;
                    }
                }
            </style>
        </head>
        <body>
            <div class="labels-print-container">
                ${selectedLabelsHTML}
            </div>
            <script>
                window.onload = function() {
                    window.print();
                    setTimeout(function() {
                        window.close();
                    }, 500);
                };
            <\/script>
        </body>
        </html>
    `);
        printWindow.document.close();
    }

    function fillCustomerCompanyDropdown(data) {
        console.log('开始填充订单号下拉框，数据:', data);

        const customerSelect = document.getElementById('contract-select');
        if (!customerSelect) {
            console.error('未找到订单号下拉框元素');
            return;
        }

        // 清空现有选项
        customerSelect.innerHTML = '';

        // 添加默认选项
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '请选择合同编号';
        customerSelect.appendChild(defaultOption);

        // 添加数据选项（带去重逻辑）
        if (data && data.length > 0) {
            // 方法四：使用 Map 去重（性能最好）
            const uniqueData = Array.from(
                new Map(data.map(item => [item.ddh, item])).values()
            );

            uniqueData.forEach(item => {
                const option = document.createElement('option');
                option.value = item.ddh;
                option.textContent = item.ddh;
                customerSelect.appendChild(option);
            });

            console.log('订单号下拉框填充完成，共添加', uniqueData.length, '个不重复选项');
        } else {
            console.warn('没有客户数据可供填充');
        }
    }
    function getSelectedContract() {
        // 优先使用输入框的值
        const input = document.getElementById('contract-input');
        if (input && input.value && input.value.trim() !== '') {
            return input.value.trim();
        }

        // 后备方案：使用原select的值
        const selectElement = document.getElementById('contract-select');
        return selectElement ? selectElement.value : '';
    }

    // 删除选中行（前端删除，不涉及后端）
    function deleteSelected() {
        if (selectedIds.length === 0) {
            alert('请先选择要删除的行！');
            return;
        }

        if (confirm(`确定要删除选中的 ${selectedIds.length} 行数据吗？这些数据将不会发货。`)) {
            // 将选中的ID添加到删除列表
            deletedIds = [...deletedIds, ...selectedIds];

            // 从表格中移除选中的行
            removeSelectedRowsFromTable();

            // 清空选中状态
            clearSelection();

            // 更新总计行数
            updateTotalCount();

            console.log('已删除的行ID:', selectedIds);
            console.log('删除列表:', deletedIds);
        }
    }

    // 更新总计行数显示
    function updateTotalCount() {
        const totalCountElement = document.getElementById('total-count');
        const selectedCountElement = document.getElementById('selected-count');

        if (totalCountElement) {
            const allRows = document.querySelectorAll('#table-body tr[data-id]');
            const validRows = Array.from(allRows).filter(row =>
                !deletedIds.includes(row.getAttribute('data-id'))
            );
            totalCountElement.textContent = `总计 ${validRows.length} 行`;
        }

        if (selectedCountElement) {
            selectedCountElement.textContent = `已选中 ${selectedIds.length} 行`;
        }
    }

    // 从表格中移除选中的行
    function removeSelectedRowsFromTable() {
        const tableBody = document.getElementById('table-body');
        const selectedRows = document.querySelectorAll('#table-body .selected-row');

        selectedRows.forEach(row => {
            tableBody.removeChild(row);
        });

        // 更新行数和序号
        rowCount = tableBody.children.length;
        updateRowCount();
        updateTotal();

        // 如果表格为空，添加一个空行
        if (rowCount === 0) {
            addRow();
        }
    }

    // 修改 fillProductTable 函数，重置删除列表
    function fillProductTable(data) {
        console.log('开始填充产品表格，数据:', data);

        const tableBody = document.getElementById('table-body');
        if (!tableBody) {
            console.error('未找到表格主体元素');
            return;
        }

        // 清空现有表格内容
        tableBody.innerHTML = '';
        // 清空选中状态和删除列表
        clearSelection();
        deletedIds = []; // 重置删除列表

        // 添加数据到表格
        if (data && data.list && data.list.length > 0) {
            // 更新客户信息 - 使用第一条数据的 khmc 字段
            const firstProduct = data.list[0];
            if (firstProduct.khmc) {
                document.getElementById('customer-name').textContent = firstProduct.khmc;
                console.log('更新客户名称为:', firstProduct.khmc);

            data.list.forEach((product, index) => {
                const newRow = document.createElement('tr');

                newRow.setAttribute('data-id', product.id);
                newRow.style.cursor = 'pointer';
                newRow.title = '点击选中/取消选中';

                newRow.innerHTML = `
                <td class="readonly-cell">${index + 1}</td>
                <td class="readonly-cell">${product.pm || ''}</td>
                <td class="readonly-cell">${product.ggxh || ''}</td>
                <td class="readonly-cell">${product.sl || 0}</td>
                <td class="readonly-cell">${product.dw || ''}</td>
                <td class="editable-cell">
                    <input type="text" style="border:none; width:100%; text-align:center; background:transparent;"
                           value="${product.bz || ''}">
                </td>
            `;
                tableBody.appendChild(newRow);
            });

            rowCount = data.list.length;
            updateRowCount();
            updateTotal();
            updateTotalCount();

            addRow();
            updateTotalCount();

    function getshdlist() {
        const ddh = getSelectedContract();
        $.ajax({
            type: 'post',
            url: '/dyshd/getshdlist',
            contentType: 'application/json',
            data: JSON.stringify({ ddh: ddh}),
            dataType: 'json',

            labelsContainer.innerHTML = '<div class="empty-labels">没有可生成标签的数据</div>';

                        <span class="checkmark"></span>
                    </label>

                <span class="label-field">合同编号:</span>
                <span class="label-value">${contractNumber}</span>
            </div>

            <div class="label-row">
                <span class="label-field">型号:</span>
                <span class="label-value">${specification}</span>
            </div>

            <div class="label-row">
                <span class="label-field">单位:</span>
                <span class="label-value">${unit}</span>
            </div>

            <div class="label-row">
                <span class="label-field">数量:</span>
                <span class="label-value label-quantity-display" id="quantity-display-${labelData.id}">
                    ${labelData.quantity}
                    <button class="edit-quantity-btn" onclick="editLabelQuantity('${labelData.id}')" title="编辑数量">
                        ✎
                    </button>
                </span>
            </div>

            <div class="label-row">
                <span class="label-field">日期:</span>
                <span class="label-value">${shipDate}</span>
            </div>

            <div class="label-row">
                <span class="label-field">备注:</span>
                <span class="label-value">${remark || '无'}</span>
            </div>

            <div class="label-actions" id="quantity-edit-${labelData.id}" style="display: none; margin-top: 8px;">
                <input type="number"

                       id="quantity-input-${labelData.id}"
                       value="${labelData.quantity}"
                       min="1"

                       onkeypress="return event.keyCode !== 13">

                <button class="label-action-btn" onclick="cancelEditQuantity('${labelData.id}')">取消</button>

    // 切换标签选择状态
    function toggleLabelSelection(labelId, isChecked) {
        if (isChecked) {
            selectedLabelIds.add(labelId);
            document.getElementById(labelId).classList.add('selected');
        } else {
            selectedLabelIds.delete(labelId);
            document.getElementById(labelId).classList.remove('selected');
            // 如果取消全选，也取消全选复选框
            document.getElementById('select-all-labels').checked = false;
        }
        updateSelectedLabelsCount();
    }

    // 全选/取消全选标签
    function toggleSelectAllLabels(selectAll) {
        const checkboxes = document.querySelectorAll('.label-select-checkbox:not(:disabled)');
        const labels = document.querySelectorAll('.label');

        checkboxes.forEach((checkbox, index) => {
            if (checkbox.checked !== selectAll) {
                checkbox.checked = selectAll;
                const labelId = labels[index].id;
                toggleLabelSelection(labelId, selectAll);
            }
        });
    }

    // 更新已选标签计数
    function updateSelectedLabelsCount() {
        const countElement = document.getElementById('selected-labels-count');
        if (countElement) {
            countElement.textContent = `已选择 ${selectedLabelIds.size} 个标签`;
        }
    }

    // 切换编辑模式
    function toggleEditMode(enableEdit) {
        labelEditMode = enableEdit;
        const checkboxes = document.querySelectorAll('.label-select-checkbox');

        checkboxes.forEach(checkbox => {
            checkbox.disabled = enableEdit;
            if (enableEdit) {
                checkbox.checked = false;
            }
        });

        // 更新选择状态
        if (enableEdit) {
            selectedLabelIds.clear();
            const labels = document.querySelectorAll('.label');
            labels.forEach(label => label.classList.remove('selected'));
            updateSelectedLabelsCount();
        }
    }

    // 编辑标签数量
    function editLabelQuantity(labelId) {
        // 显示编辑区域
        const editDiv = document.getElementById(`quantity-edit-${labelId}`);
        const displayDiv = document.getElementById(`quantity-display-${labelId}`);

        if (editDiv && displayDiv) {
            displayDiv.style.display = 'none';
            editDiv.style.display = 'flex';

            // 聚焦到输入框
            const input = document.getElementById(`quantity-input-${labelId}`);
            if (input) {
                input.focus();
                input.select();
            }
        }
    }

    // 保存标签数量
    function saveLabelQuantity(labelId) {
        console.log('=== saveLabelQuantity 函数开始执行 ===');
        console.log('参数labelId:', labelId);

        // 获取所有相关元素
        const input = document.getElementById(`quantity-input-${labelId}`);
        const editDiv = document.getElementById(`quantity-edit-${labelId}`);
        const displayDiv = document.getElementById(`quantity-display-${labelId}`);

        console.log('找到的元素:');
        console.log('1. 输入框:', input, input ? 'value=' + input.value : '未找到');
        console.log('2. 编辑区域:', editDiv);
        console.log('3. 显示区域:', displayDiv);

        // 检查元素是否存在
        if (!input) {
            console.error('❌ 错误：找不到输入框元素');
            alert('错误：找不到输入框');
            return;
        }
        if (!editDiv) {
            console.error('❌ 错误：找不到编辑区域');
            return;
        }
        if (!displayDiv) {
            console.error('❌ 错误：找不到显示区域');
            return;
        }

        // 获取输入值
        const inputValue = input.value;
        console.log('输入值:', inputValue);

        const newQuantity = parseInt(inputValue);
        console.log('解析后的数量:', newQuantity);

        if (isNaN(newQuantity) || newQuantity < 1) {
            console.error('❌ 错误：数量无效');
            alert('请输入有效的数量（大于0的数字）');
            input.focus();
            return;
        }

        // 查找标签数据
        const labelData = allLabelsData.find(item => item.id === labelId);
        console.log('找到的标签数据:', labelData);

        if (!labelData) {
            console.error('❌ 错误：找不到标签数据');
            alert('错误：找不到标签数据');
            return;
        }

        // 验证数量范围
        const maxQuantity = labelData.originalQuantity * 2;
        console.log('原始数量:', labelData.originalQuantity, '最大允许数量:', maxQuantity);

        const finalQuantity = Math.max(1, Math.min(newQuantity, maxQuantity));
        console.log('最终数量:', finalQuantity);

        // 更新数据
        labelData.quantity = finalQuantity;
        labelQuantities[labelId] = finalQuantity;
        console.log('数据更新完成');

        // 更新显示 - 关键修复部分
        console.log('显示区域的innerHTML:', displayDiv.innerHTML);

        // 方法1：使用正则表达式替换数量值
        const currentHTML = displayDiv.innerHTML;
        console.log('当前HTML:', currentHTML);

        // 提取当前的数量值（数字部分）
        const quantityMatch = currentHTML.match(/(\d+)/);
        if (quantityMatch) {
            const oldQuantity = quantityMatch[1];
            console.log('找到旧数量:', oldQuantity);

            // 替换数量值
            const newHTML = currentHTML.replace(oldQuantity, finalQuantity);
            displayDiv.innerHTML = newHTML;
            console.log('更新后的HTML:', newHTML);
        } else {
            // 方法2：如果正则匹配失败，重建整个内容
            console.log('使用方法2：重建显示内容');
            const editBtn = displayDiv.querySelector('.edit-quantity-btn');
            if (editBtn) {
                // 保存编辑按钮
                const editBtnHTML = editBtn.outerHTML;
                displayDiv.innerHTML = `${finalQuantity} ${editBtnHTML}`;
            } else {
                // 如果没有编辑按钮，只显示数量
                displayDiv.innerHTML = `${finalQuantity}`;
                // 重新添加编辑按钮
                const newEditBtn = document.createElement('button');
                newEditBtn.className = 'edit-quantity-btn';
                newEditBtn.title = '编辑数量';
                newEditBtn.textContent = '✎';
                newEditBtn.onclick = function() { editLabelQuantity(labelId); };
                displayDiv.appendChild(newEditBtn);
            }
        }

        // 确保输入框值也更新
        input.value = finalQuantity;

        // 切换显示/隐藏
        displayDiv.style.display = 'inline-flex';
        editDiv.style.display = 'none';

        console.log('样式切换完成');
        console.log('displayDiv.style.display:', displayDiv.style.display);
        console.log('editDiv.style.display:', editDiv.style.display);

        // 显示成功提示
        showQuantityEditSuccess(labelId);

        console.log('=== saveLabelQuantity 函数执行完成 ===');
    }

    // 取消编辑数量
    function cancelEditQuantity(labelId) {
        const editDiv = document.getElementById(`quantity-edit-${labelId}`);
        const displayDiv = document.getElementById(`quantity-display-${labelId}`);
        const input = document.getElementById(`quantity-input-${labelId}`);

        if (editDiv && displayDiv && input) {
            const labelData = allLabelsData.find(item => item.id === labelId);
            if (labelData) {
                input.value = labelData.quantity; // 恢复原值
            }

            displayDiv.style.display = 'inline-flex';
            editDiv.style.display = 'none';

    // 显示数量编辑成功提示
    function showQuantityEditSuccess(labelId) {

    // 发货选中标签
    function shipSelected() {
        if (selectedLabelIds.size === 0) {
            alert('请先选择要发货的标签！');
            return;
        }

        // 获取发货日期
        const shipDate = document.getElementById('fhrq').value;
        if (!shipDate) {
            alert('请先选择发货日期！');
            return;
        }

        // 获取合同号
        const contractNumber = getSelectedContract();
        if (!contractNumber) {
            alert('请先选择合同编号！');
            return;
        }

        // 获取选中的标签数据
        const selectedLabels = Array.from(selectedLabelIds).map(labelId => {
            const labelData = allLabelsData.find(item => item.id === labelId);
            return {
                productId: labelData.productId,
                quantity: labelQuantities[labelId] || labelData.originalQuantity,
                originalQuantity: labelData.originalQuantity,
                productName: labelData.productName,
                specification: labelData.specification
            };
        }).filter(item => item.productId); // 过滤掉没有productId的

        if (selectedLabels.length === 0) {
            alert('选中的标签无效，请重新选择！');
            return;
        }

        // 验证数量修改
        const modifiedLabels = selectedLabels.filter(item =>
            item.quantity !== item.originalQuantity
        );

        if (modifiedLabels.length > 0) {
            let message = `以下标签的数量已被修改：\n`;
            modifiedLabels.forEach(item => {
                message += `${item.productName} (${item.specification}): ${item.originalQuantity} → ${item.quantity}\n`;
            });
            message += `\n确定按修改后的数量发货吗？`;

            if (!confirm(message)) {
                return;
            }
        }

        if (confirm(`确定发货 ${selectedLabels.length} 个标签吗？`)) {
            const productIds = selectedLabels.map(item => item.productId);
            const quantities = selectedLabels.map(item => item.quantity);

            $.ajax({
                type: 'post',
                url: '/dyshd/shipSelectedProducts',
                contentType: 'application/json',
                data: JSON.stringify({
                    ids: productIds,
                    quantities: quantities,
                    fhrq: shipDate,
                    ddh: contractNumber
                }),
                dataType: 'json',
                success: function(res) {
                    console.log("发货选中标签请求成功", res);
                    if (res.code == 200) {
                        alert(`成功发货 ${selectedLabels.length} 个标签！`);
                        // 移除已发货的标签
                        removeShippedLabels(selectedLabelIds);
                    } else {
                        alert("发货失败: " + res.message);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("发货选中标签请求失败:", error);
                    alert("发货失败，请检查网络连接");
                }
            });
        }
    }

    // 移除已发货的标签
    function removeShippedLabels(labelIds) {
        labelIds.forEach(labelId => {
            const labelElement = document.getElementById(labelId);
            if (labelElement) {
                labelElement.remove();
            }

            // 从数据中移除
            allLabelsData = allLabelsData.filter(item => item.id !== labelId);
            delete labelQuantities[labelId];
        });

        selectedLabelIds.clear();
        updateSelectedLabelsCount();

        // 如果没有标签了，显示空状态
        const labelsContainer = document.getElementById('labels-container');
        if (labelsContainer.children.length === 0) {
            labelsContainer.innerHTML = '<div class="empty-labels">暂无发货标签，请点击"发货"生成标签</div>';
        }
    }

    // 发货全部行（排除已删除的行）
    function shipAll() {
        // 获取表格中所有有ID的行（排除已删除的行）
        const allRows = document.querySelectorAll('#table-body tr[data-id]');
        const allIds = Array.from(allRows)
            .map(row => row.getAttribute('data-id'))
            .filter(id => !deletedIds.includes(id));

        if (allIds.length === 0) {
            alert('表格中没有可发货的数据！');
            return;
        }

        // 获取发货日期
        const shipDate = document.getElementById('fhrq').value;
        if (!shipDate) {
            alert('请先选择发货日期！');
            return;
        }

        // 获取合同号
        const contractNumber = getSelectedContract();
        if (!contractNumber) {
            alert('请先选择合同编号！');
            return;
        }

        if (confirm(`确定发货全部 ${allIds.length} 行数据吗？`)) {
            // 生成发货标签
            const validRows = Array.from(allRows).filter(row =>
                !deletedIds.includes(row.getAttribute('data-id'))
            );
            generateLabels(validRows);

            // 自动选中所有生成的标签
            setTimeout(() => {
                toggleSelectAllLabels(true);
            }, 100);

            $.ajax({
                type: 'post',
                url: '/dyshd/shipProducts',
                contentType: 'application/json',
                data: JSON.stringify({
                    ids: allIds,
                    fhrq: shipDate,
                    ddh: contractNumber
                }),
                dataType: 'json',
                success: function(res) {
                    console.log("发货全部行请求成功", res);
                    if (res.code == 200) {
                        alert(`全部 ${allIds.length} 行数据发货成功！标签已生成，请选择要打印的标签。`);
                    } else {
                        alert("发货失败: " + res.message);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("发货全部行请求失败:", error);
                    alert("发货失败，请检查网络连接");
                }
            });
        }
    }

    function getghf() {
        $.ajax({
            type: 'post',
            url: '/hetong/ghf',
            contentType: 'application/json',
            dataType: 'json',
            success: function(res) {
                if (res.success) {
                    console.log("返回的供货方信息", res);

                    // 使用返回的数据更新页面元素
                    if (res.data && res.data.length > 0) {
                        // 1. 提取第一条有效的ghf数据
                        const validSupplier = res.data[0];

                        if (validSupplier && validSupplier.ghf) {
                            // 2. 直接更新公司名称
                            updateCompanyName(validSupplier.ghf);
                        } else {
                            console.warn("没有找到有效的供货方数据");
                        }

                        if (validSupplier && validSupplier.dizhi) {
                            // 2. 直接更新公司名称
                            updateDizhiName(validSupplier.dizhi);
                        } else {
                            console.warn("没有找到有效的供货方数据");
                        }
                    }
                } else {
                    console.error("查询失败:", res.message);
                }
            },
            error: function(xhr, status, error) {
                console.error("AJAX请求失败:", error);
                alert("请求失败，请检查网络连接");
            }
        });
    }

    // 新增：更新公司名称的函数
    function updateCompanyName(companyName) {
        if (companyName && companyName.trim() !== '') {
            // 更新页面中的公司名称（送货单上的）
            const companyNameElement = document.querySelector('.delivery-note .company-name');
            if (companyNameElement) {
                companyNameElement.textContent = companyName + '-送货单';
                console.log('公司名称已更新为:', companyName + '-送货单');
            }
        } else {
            console.warn('供货方名称为空，未更新公司名称');
        }
    }

    function updateDizhiName(dizhi) {
        if (dizhi && dizhi.trim() !== '') {
            console.log('要设置的地址:', dizhi);

            // 使用ID查找元素
            const addressElement = document.getElementById('company-address');

            if (addressElement) {
                console.log('通过ID找到地址元素:', addressElement);
                // 更新地址内容
                addressElement.textContent = '地址：' + dizhi;
                console.log('地址已更新为:', addressElement.textContent);
            } else {
                console.error('未找到ID为company-address的地址元素');
                // 后备方案：尝试使用class选择器
                const fallbackElement = document.querySelector('.address');
                if (fallbackElement) {
                    console.log('使用class选择器找到地址元素:', fallbackElement);
                    fallbackElement.textContent = '地址：' + dizhi;
                }
            }
        } else {
            console.warn('供货方地址为空，未更新地址');
        }
    }
